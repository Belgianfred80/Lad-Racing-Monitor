name: Monitoring Ladbrokes

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: monitoring
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Lancer les verifications
        id: verif
        continue-on-error: true
        run: node monitor/check.js

      - name: Recuperer les derniers incidents
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label monitoring --state all --limit 2 --json title,body,url,state,createdAt,closedAt > dernier_incident.json || echo "[]" > dernier_incident.json

      - name: Archiver la mesure et mettre a jour l historique
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          let d = null;
          try { d = JSON.parse(fs.readFileSync("artifacts/summary.json")); } catch(e) { process.exit(0); }
          const pts = d.results.map(function(r){
            return { n: r.name, ok: r.ok ? 1 : 0, ms: r.loadTimeMs || null };
          });
          const mesure = { t: d.date, p: pts };
          fs.mkdirSync("archive", { recursive: true });
          const mois = d.date.slice(0, 7);
          fs.appendFileSync("archive/" + mois + ".jsonl", JSON.stringify(mesure) + "\n");
          let hist = [];
          try { hist = JSON.parse(fs.readFileSync("history.json")); } catch(e) {}
          if (!Array.isArray(hist)) { hist = []; }
          hist.push(mesure);
          const limite = Date.now() - 7 * 24 * 3600 * 1000;
          hist = hist.filter(function(m){ return new Date(m.t).getTime() >= limite; });
          fs.writeFileSync("history.json", JSON.stringify(hist));
          console.log("Historique : " + hist.length + " mesures sur 7 jours ; archive " + mois);
          '

      - name: Generer le rapport et la page de statut
        if: always()
        env:
          CRON_STATUS_URL: https://mjqtyp8y.status.cron-job.org/
          REPO_ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/monitor.yml
          REPO_ARCHIVE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/main/archive
        run: |
          node -e '
          const fs = require("fs");
          let d = null;
          try { d = JSON.parse(fs.readFileSync("artifacts/summary.json")); } catch(e) {}
          if (!d) {
            fs.writeFileSync("issue.md", "Le monitoring lui-meme a rencontre une erreur technique (aucun resultat produit). Voir les logs du run.");
            fs.writeFileSync("nb_echecs.txt", "1");
            process.exit(0);
          }
          let seuilMs = 15000;
          try { seuilMs = require("./monitor/pages.config.js").maxLoadTimeMs || 15000; } catch(e) {}
          let hist = [];
          try { hist = JSON.parse(fs.readFileSync("history.json")); } catch(e) {}
          if (!Array.isArray(hist)) { hist = []; }
          const fdate = (iso) => new Date(iso).toLocaleString("fr-BE", { timeZone: "Europe/Brussels" });
          const date = fdate(d.date);
          const detail = (r) => r.details[r.details.length-1].split("|").join("-");
          const echapper = (t) => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
          let md = "# Etat du monitoring Ladbrokes\n\nDerniere verification : **" + date + "** (heure belge)\n\n| Page | Etat | Detail |\n|---|---|---|\n";
          for (const r of d.results) {
            md += "| [" + r.name + "](" + r.url + ") | " + (r.ok ? "OK" : "ECHEC") + " | " + detail(r) + " |\n";
          }
          fs.writeFileSync("STATUS.md", md);
          let issue = "Verification du " + date + " (heure belge)\n\n";
          for (const r of d.results) {
            issue += (r.ok ? "OK — " : "ECHEC — ") + "**" + r.name + "**\nURL : " + r.url + "\nDetail : " + detail(r) + "\n\n";
          }
          issue += "_Les captures sont dans la section Artifacts du run._";
          fs.writeFileSync("issue.md", issue);
          fs.writeFileSync("nb_echecs.txt", String(d.results.filter(r => !r.ok).length));
          let incidentHtml = "<p class=\"vide\">Aucun incident enregistre depuis la mise en service.</p>";
          try {
            const incs = JSON.parse(fs.readFileSync("dernier_incident.json")).slice(0, 2);
            if (incs.length) {
              incidentHtml = incs.map(function(inc, i) {
                const resolu = inc.state === "CLOSED";
                const badge = resolu
                  ? `<span class="pill pill-ok">Resolu ${fdate(inc.closedAt)}</span>`
                  : `<span class="pill pill-ko">En cours</span>`;
                const corps = echapper(inc.body || "")
                  .split("\n").filter((l) => !l.startsWith("_")).join("\n")
                  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                  .replace(/\n/g, "<br>");
                return `<article class="incident ${resolu ? "ok" : "ko"}">
                  <div class="incident-tete">
                    <span class="rang">${i === 0 ? "Le plus recent" : "Precedent"}</span>${badge}
                  </div>
                  <h4><a href="${inc.url}">${echapper(inc.title)}</a></h4>
                  <p class="quand">Ouvert le ${fdate(inc.createdAt)}</p>
                  <div class="corps">${corps}</div>
                </article>`;
              }).join("");
            }
          } catch(e) {}
          const carte = (r, idx) => {
            const secondes = r.loadTimeMs ? (r.loadTimeMs / 1000).toFixed(1) : null;
            const pct = r.loadTimeMs ? Math.min(100, Math.round((r.loadTimeMs / seuilMs) * 100)) : 0;
            const raison = r.ok ? "" : `<p class="raison">${echapper(detail(r))}</p>`;
            return `<article class="carte ${r.ok ? "ok" : "ko"}">
              <div class="carte-tete">
                <span class="marque">${r.ok ? "&#10003;" : "&#10005;"}</span>
                <h3>${r.name}</h3>
                <span class="pill ${r.ok ? "pill-ok" : "pill-ko"}">${r.ok ? "En ligne" : "Probleme"}</span>
              </div>
              <a class="url" href="${r.url}">${r.url}</a>
              <div class="mesure">
                <span class="chiffre">${secondes ? secondes : "--"}</span><span class="unite">s</span>
                <span class="libelle">temps de chargement</span>
              </div>
              <div class="piste"><span style="width:${pct}%"></span></div>
              <p class="seuil">seuil ${(seuilMs / 1000).toFixed(0)} s</p>
              ${raison}
              <div class="graph">
                <div class="graph-tete">
                  <span class="dispo" id="dispo-${idx}">&nbsp;</span>
                  <span class="periode-info" id="pinfo-${idx}"></span>
                </div>
                <div class="svg-hote" id="svg-${idx}"></div>
                <div class="barres" id="barres-${idx}"></div>
                <p class="legende-barres">une barre = une verification &middot; bleu = reussie, rouge = echec</p>
              </div>
            </article>`;
          };
          const cronUrl = process.env.CRON_STATUS_URL || "https://cron-job.org";
          const actionsUrl = process.env.REPO_ACTIONS_URL || "https://github.com";
          const archiveUrl = process.env.REPO_ARCHIVE_URL || "https://github.com";
          const noms = d.results.map(function(r){ return r.name; });
          const G = String.fromCharCode(34);
          const scriptClient = [
            "<script>",
            "var HIST = " + JSON.stringify(hist) + ";",
            "var NOMS = " + JSON.stringify(noms) + ";",
            "var SEUIL = " + seuilMs + ";",
            "var G = String.fromCharCode(34);",
            "var genere = " + JSON.stringify(d.date) + ";",
            "var diff = Math.round((Date.now() - new Date(genere).getTime()) / 60000);",
            "if (diff > 45) {",
            "  document.getElementById(\"banniere-retard\").style.display = \"block\";",
            "  document.getElementById(\"retard-min\").textContent = diff;",
            "}",
            "function fh(iso) {",
            "  if (!iso) return null;",
            "  return new Date(iso).toLocaleString(\"fr-BE\", { timeZone: \"Europe/Brussels\", day: \"2-digit\", month: \"2-digit\", year: \"numeric\", hour: \"2-digit\", minute: \"2-digit\" });",
            "}",
            "function heureCourte(iso, jours) {",
            "  var o = jours ? { timeZone: \"Europe/Brussels\", day: \"2-digit\", month: \"2-digit\" } : { timeZone: \"Europe/Brussels\", hour: \"2-digit\", minute: \"2-digit\" };",
            "  return new Date(iso).toLocaleString(\"fr-BE\", o);",
            "}",
            "var periode = 1;",
            "function dessiner() {",
            "  var limite = Date.now() - periode * 24 * 3600 * 1000;",
            "  var pts = HIST.filter(function(m){ return new Date(m.t).getTime() >= limite; });",
            "  NOMS.forEach(function(nom, idx) {",
            "    var serie = [];",
            "    pts.forEach(function(m){",
            "      var p = (m.p || []).filter(function(x){ return x.n === nom; })[0];",
            "      if (p) { serie.push({ t: m.t, ok: p.ok, ms: p.ms }); }",
            "    });",
            "    var hote = document.getElementById(\"svg-\" + idx);",
            "    var barres = document.getElementById(\"barres-\" + idx);",
            "    var dispo = document.getElementById(\"dispo-\" + idx);",
            "    var pinfo = document.getElementById(\"pinfo-\" + idx);",
            "    if (!hote) return;",
            "    if (serie.length < 2) {",
            "      hote.innerHTML = \"<p class=vide-graph>Pas encore assez de mesures sur cette periode. L historique se construit a chaque verification.</p>\";",
            "      barres.innerHTML = \"\"; dispo.innerHTML = \"&nbsp;\"; pinfo.textContent = \"\";",
            "      return;",
            "    }",
            "    var nbOk = serie.filter(function(s){ return s.ok === 1; }).length;",
            "    var taux = (nbOk / serie.length) * 100;",
            "    var classeT = taux >= 99 ? \"ok\" : (taux >= 95 ? \"moyen\" : \"ko\");",
            "    dispo.className = \"dispo \" + classeT;",
            "    dispo.innerHTML = taux.toFixed(1).replace(\".0\", \"\") + \" % de disponibilite\";",
            "    pinfo.textContent = serie.length + \" verifications \" + (periode === 1 ? \"sur 24 h\" : \"sur 7 jours\");",
            "    var W = 640, H = 150, mgg = 34, mgd = 8, mgh = 12, mgb = 18;",
            "    var iw = W - mgg - mgd, ih = H - mgh - mgb;",
            "    var vals = serie.filter(function(s){ return s.ms; }).map(function(s){ return s.ms; });",
            "    var maxV = Math.max(SEUIL, vals.length ? Math.max.apply(null, vals) : SEUIL);",
            "    maxV = Math.ceil(maxV / 5000) * 5000;",
            "    var t0 = new Date(serie[0].t).getTime();",
            "    var t1 = new Date(serie[serie.length-1].t).getTime();",
            "    var etendue = Math.max(1, t1 - t0);",
            "    var X = function(t){ return mgg + ((new Date(t).getTime() - t0) / etendue) * iw; };",
            "    var Y = function(ms){ return mgh + ih - (ms / maxV) * ih; };",
            "    var chemin = \"\", ouvert = false;",
            "    serie.forEach(function(s){",
            "      if (s.ms) { chemin += (ouvert ? \" L \" : \" M \") + X(s.t).toFixed(1) + \" \" + Y(s.ms).toFixed(1); ouvert = true; }",
            "      else { ouvert = false; }",
            "    });",
            "    var aire = \"\";",
            "    var avecMs = serie.filter(function(s){ return s.ms; });",
            "    if (avecMs.length > 1) {",
            "      var bas = (mgh + ih).toFixed(1);",
            "      aire = \"<path d=\" + G + \"M \" + X(avecMs[0].t).toFixed(1) + \" \" + bas + chemin.replace(/^ M /, \" L \") + \" L \" + X(avecMs[avecMs.length-1].t).toFixed(1) + \" \" + bas + \" Z\" + G + \" class=aire />\";",
            "    }",
            "    var pointsKo = serie.filter(function(s){ return s.ok === 0 && s.ms; }).map(function(s){",
            "      return \"<circle cx=\" + X(s.t).toFixed(1) + \" cy=\" + Y(s.ms).toFixed(1) + \" r=3 class=pt-ko><title>\" + fh(s.t) + \"</title></circle>\";",
            "    }).join(\"\");",
            "    var grilles = \"\", etiquettes = \"\";",
            "    [0, 0.5, 1].forEach(function(f){",
            "      var v = maxV * f, y = Y(v);",
            "      grilles += \"<line x1=\" + mgg + \" y1=\" + y.toFixed(1) + \" x2=\" + (W - mgd) + \" y2=\" + y.toFixed(1) + \" class=grille />\";",
            "      etiquettes += \"<text x=\" + (mgg - 6) + \" y=\" + (y + 3).toFixed(1) + \" class=axe text-anchor=end>\" + (v / 1000).toFixed(0) + \"s</text>\";",
            "    });",
            "    var ySeuil = Y(SEUIL);",
            "    var ligneSeuil = \"<line x1=\" + mgg + \" y1=\" + ySeuil.toFixed(1) + \" x2=\" + (W - mgd) + \" y2=\" + ySeuil.toFixed(1) + \" class=seuil-l />\";",
            "    var tempsD = \"<text x=\" + mgg + \" y=\" + (H - 4) + \" class=axe>\" + heureCourte(serie[0].t, periode > 1) + \"</text>\";",
            "    var tempsF = \"<text x=\" + (W - mgd) + \" y=\" + (H - 4) + \" class=axe text-anchor=end>\" + heureCourte(serie[serie.length-1].t, periode > 1) + \"</text>\";",
            "    hote.innerHTML = \"<svg viewBox=\" + G + \"0 0 \" + W + \" \" + H + G + \" preserveAspectRatio=\" + G + \"none\" + G + \" class=courbe>\" + + grilles + ligneSeuil + aire + \"<path d=\" + G + chemin + G + \" class=ligne />\" + pointsKo + etiquettes + tempsD + tempsF + \"</svg>\";",
            "    var maxB = 120;",
            "    var pas = Math.max(1, Math.ceil(serie.length / maxB));",
            "    var groupes = [];",
            "    for (var i = 0; i < serie.length; i += pas) {",
            "      var tranche = serie.slice(i, i + pas);",
            "      var ko = tranche.filter(function(s){ return s.ok === 0; }).length;",
            "      groupes.push({ ko: ko, t: tranche[0].t, n: tranche.length });",
            "    }",
            "    barres.innerHTML = groupes.map(function(g){",
            "      return \"<span class=\" + G + \"b \" + (g.ko ? \"b-ko\" : \"b-ok\") + G + \" title=\" + G + fh(g.t) + (g.ko ? \" — \" + g.ko + \" echec(s)\" : \" — ok\") + G + \"></span>\";",
            "    }).join(\"\");",
            "  });",
            "}",
            "document.querySelectorAll(\".btn-periode\").forEach(function(b){",
            "  b.addEventListener(\"click\", function(){",
            "    document.querySelectorAll(\".btn-periode\").forEach(function(x){ x.classList.remove(\"actif\"); });",
            "    b.classList.add(\"actif\");",
            "    periode = parseInt(b.getAttribute(\"data-j\"), 10);",
            "    dessiner();",
            "  });",
            "});",
            "dessiner();",
            "var resume = { Actions: null, Pages: null };",
            "function majResume() {",
            "  var el = document.getElementById(\"infra-resume\");",
            "  if (!el) return;",
            "  var txt = [];",
            "  Object.keys(resume).forEach(function(k){",
            "    if (resume[k] === null) return;",
            "    txt.push(k + \" \" + (resume[k] ? \"&#10003;\" : \"&#10005;\"));",
            "  });",
            "  if (!txt.length) return;",
            "  var tout = Object.keys(resume).every(function(k){ return resume[k] !== false; });",
            "  el.className = \"infra-resume \" + (tout ? \"ok\" : \"ko\");",
            "  el.innerHTML = txt.join(\" &middot; \");",
            "}",
            "fetch(\"https://www.githubstatus.com/api/v2/components.json\")",
            "  .then(function(r){ return r.json(); })",
            "  .then(function(data){",
            "    var m = { \"Actions\": \"gh-actions\", \"Pages\": \"gh-pages\" };",
            "    data.components.forEach(function(c){",
            "      var id = m[c.name];",
            "      if (!id) return;",
            "      var ok = c.status === \"operational\";",
            "      resume[c.name] = ok;",
            "      var el = document.getElementById(id);",
            "      if (el) {",
            "        el.className = \"etat-svc \" + (ok ? \"ok\" : \"ko\");",
            "        el.innerHTML = ok ? \"&#10003; Operationnel\" : \"&#10005; \" + c.status.split(\"_\").join(\" \");",
            "      }",
            "    });",
            "    majResume();",
            "  })",
            "  .catch(function(){});",
            "fetch(\"https://www.githubstatus.com/api/v2/incidents.json\")",
            "  .then(function(r){ return r.json(); })",
            "  .then(function(data){",
            "    var vise = [\"Actions\", \"Pages\"];",
            "    var lignes = [];",
            "    (data.incidents || []).forEach(function(inc){",
            "      if (lignes.length >= 5) return;",
            "      var touches = (inc.components || []).map(function(c){ return c.name; }).filter(function(n){ return vise.indexOf(n) >= 0; });",
            "      if (touches.length === 0) return;",
            "      var fin = inc.resolved_at ? (\"<span class=ok>fini \" + fh(inc.resolved_at) + \"</span>\") : \"<span class=ko>en cours</span>\";",
            "      lignes.push(\"<li><p class=quand>\" + fh(inc.created_at) + \" &rarr; \" + fin + \"</p><p class=quoi>\" + inc.name + \" — \" + touches.join(\", \") + \" &middot; <a href=\" + inc.shortlink + \">details</a></p></li>\");",
            "    });",
            "    document.getElementById(\"gh-incidents\").innerHTML = lignes.length ? \"<ul>\" + lignes.join(\"\") + \"</ul>\" : \"<p class=vide>Aucun incident recent sur ces services.</p>\";",
            "  })",
            "  .catch(function(){ document.getElementById(\"gh-incidents\").innerHTML = \"<p class=vide>Historique indisponible.</p>\"; });",
            "</" + "script>",
          ].join("\n");
          const html = `<!DOCTYPE html>
          <html lang="fr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="300">
          <title>Statut monitoring Ladbrokes</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
          <style>
            :root {
              --fond:#0e1319; --panneau:#161d26; --panneau2:#121821; --bord:#232d39;
              --texte:#e8edf3; --doux:#8b98a8; --tres-doux:#5d6b7c;
              --vert:#37d99a; --rouge:#ff6259; --ambre:#f2b544;
            }
            * { box-sizing:border-box; }
            body { margin:0; background:var(--fond); color:var(--texte);
              font-family:"Inter Tight", system-ui, -apple-system, Segoe UI, sans-serif;
              -webkit-font-smoothing:antialiased; }
            .wrap { max-width:760px; margin:0 auto; padding:40px 20px 56px; }
            .tete { border-bottom:1px solid var(--bord); padding-bottom:22px; margin-bottom:26px; }
            .eyebrow { margin:0 0 6px; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--doux); }
            h1 { margin:0; font-size:2.1rem; font-weight:700; letter-spacing:-.02em; }
            .horodatage { margin:10px 0 0; font-size:.85rem; color:var(--doux);
              font-family:"JetBrains Mono", ui-monospace, monospace; }
            .pulse { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--vert);
              margin-right:8px; box-shadow:0 0 0 4px rgba(55,217,154,.15); }
            .banniere { display:none; margin-bottom:24px; padding:14px 18px; border-radius:12px;
              background:rgba(242,181,68,.1); border:1px solid rgba(242,181,68,.35); color:#f6d79a; font-size:.9rem; }
            .bloc-surveille { background:var(--panneau2); border:1px solid var(--bord);
              border-radius:20px; padding:22px; }
            .bloc-tete { display:flex; align-items:center; gap:10px; margin:0 2px 16px; flex-wrap:wrap; }
            .bloc-tete h2 { margin:0; font-size:1rem; font-weight:600; letter-spacing:-.01em; }
            .bloc-tete .st { font-size:.74rem; color:var(--doux); flex:1; }
            .switch { display:flex; gap:4px; background:#0f151c; border:1px solid var(--bord);
              border-radius:99px; padding:3px; }
            .btn-periode { border:none; background:none; color:var(--doux); cursor:pointer;
              font-family:inherit; font-size:.74rem; font-weight:600; padding:5px 12px; border-radius:99px; }
            .btn-periode.actif { background:var(--bord); color:var(--texte); }
            .sous-titre { font-size:.72rem; letter-spacing:.16em; text-transform:uppercase;
              color:var(--doux); margin:26px 2px 12px; font-weight:600; }
            .carte { background:var(--panneau); border:1px solid var(--bord); border-radius:14px;
              padding:20px 22px; margin-bottom:12px; position:relative; overflow:hidden; }
            .carte::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--vert); }
            .carte.ko::before { background:var(--rouge); }
            .carte-tete { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
            .marque { width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
              font-size:.72rem; font-weight:700; background:rgba(55,217,154,.16); color:var(--vert); }
            .carte.ko .marque { background:rgba(255,98,89,.16); color:var(--rouge); }
            .carte h3 { margin:0; font-size:1.05rem; font-weight:600; flex:1; color:var(--texte); }
            .pill { font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700;
              padding:4px 10px; border-radius:99px; white-space:nowrap; }
            .pill-ok { background:rgba(55,217,154,.14); color:var(--vert); }
            .pill-ko { background:rgba(255,98,89,.14); color:var(--rouge); }
            .url { display:block; margin:10px 0 18px; font-size:.78rem; color:#6f8ac4;
              font-family:"JetBrains Mono", ui-monospace, monospace; text-decoration:none; word-break:break-all; }
            .url:hover { color:#9ab2e8; text-decoration:underline; }
            .mesure { display:flex; align-items:baseline; gap:6px; }
            .chiffre { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:2.4rem;
              font-weight:700; line-height:1; letter-spacing:-.03em; }
            .unite { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:1rem; color:var(--doux); }
            .libelle { margin-left:8px; font-size:.78rem; color:var(--doux); }
            .piste { height:5px; border-radius:99px; background:#0a0f14; margin:14px 0 6px; overflow:hidden; }
            .piste span { display:block; height:100%; border-radius:99px;
