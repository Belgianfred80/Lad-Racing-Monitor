            footer { margin-top:28px; font-size:.72rem; color:var(--tres-doux); line-height:1.7; }
            @media (max-width:520px) {
              h1 { font-size:1.6rem; } .chiffre { font-size:1.9rem; }
              .bloc-surveille { padding:16px; border-radius:16px; }
              .carte { padding:16px; }
            }
          </style></head><body>
          <div class="wrap">
            <header class="tete">
              <p class="eyebrow">Surveillance des pages de courses</p>
              <h1>Ladbrokes.be</h1>
              <p class="horodatage"><span class="pulse"></span>Derniere verification ${date}</p>
            </header>
            <div id="banniere-retard" class="banniere">Cette page date de <span id="retard-min"></span> minutes. Le monitoring semble retarde : depliez Infrastructure du monitoring en bas de page.</div>
            <section class="bloc-surveille">
              <div class="bloc-tete">
                <span class="st"></span>
                <div class="switch">
                  <button class="btn-periode actif" data-j="1">24 h</button>
                  <button class="btn-periode" data-j="7">7 jours</button>
                </div>
              </div>
              ${d.results.map(carte).join("")}
              <p class="sous-titre">Derniers incidents detectes sur ces pages</p>
              ${incidentHtml}
            </section>
            <div class="coupure"><span>Coulisses techniques</span></div>
            <details class="infra">
              <summary>
                <span class="fleche">&#9656;</span>
                <strong>Infrastructure du monitoring</strong>
                <span id="infra-resume" class="infra-resume">...</span>
              </summary>
              <div class="infra-corps">
                <p class="infra-note">Ces services ne concernent pas Ladbrokes : ils font tourner la surveillance elle-meme.</p>
                <div class="sous-bloc">
                  <div class="sous-bloc-tete"><h4>1. Planificateur</h4><span>cron-job.org</span></div>
                  <p class="role">Declenche une verification toutes les 12 minutes, de 07h00 a 23h48. Son historique de declenchements et son etat sont consultables sur sa propre page de statut.</p>
                  <a class="bouton" href="${cronUrl}">Statut du planificateur (cron-job.org)</a>
                </div>
                <div class="sous-bloc">
                  <div class="sous-bloc-tete"><h4>2. Execution et hebergement</h4><span>GitHub</span></div>
                  <p class="role">GitHub Actions execute les verifications demandees par le planificateur ; GitHub Pages heberge cette page. Si Actions tombe en panne, les verifications sont suspendues et cette page cesse de se mettre a jour.</p>
                  <div class="infra-liste">
                    <p><span>GitHub Actions <small>execute les verifications</small></span><span id="gh-actions" class="etat-svc">...</span></p>
                    <p><span>GitHub Pages <small>heberge cette page</small></span><span id="gh-pages" class="etat-svc">...</span></p>
                  </div>
                  <p class="titre-frise">Incidents GitHub recents sur ces services</p>
                  <div id="gh-incidents" class="timeline"><p class="vide">chargement...</p></div>
                  <p class="titre-frise">Executions et donnees</p>
                  <a class="bouton" href="${actionsUrl}">Historique complet des executions</a>
                  <a class="bouton" href="${archiveUrl}">Archives des mesures</a>
                </div>
              </div>
            </details>
            <footer>Page regeneree a chaque verification. Graphiques bases sur les 7 derniers jours ; toutes les mesures sont archivees par mois sans limite de duree. Toutes les heures sont en heure belge (Europe/Brussels). BELFLA 2026</footer>
          </div>
          ${scriptClient}
          </body></html>`;
          fs.writeFileSync("index.html", html);
          '

      - name: Publier la page de statut
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add STATUS.md index.html history.json archive 2>/dev/null || git add STATUS.md
          git diff --cached --quiet || git commit -m "Mise a jour du statut"
          git push || true

      - name: Alerter ou clore (e-mail via Issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NB=$(cat nb_echecs.txt 2>/dev/null || echo "1")
          gh label create monitoring --color D93F0B --description "Alerte du monitoring" 2>/dev/null || true
          OUVERTE=$(gh issue list --label monitoring --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ "$NB" != "0" ]; then
            if [ -z "$OUVERTE" ]; then
              gh issue create --title "ALERTE Monitoring Ladbrokes : $NB page(s) en echec" --body-file issue.md --label monitoring
            else
              echo "Alerte deja ouverte (#$OUVERTE), pas de nouvel e-mail."
            fi
          else
            if [ -n "$OUVERTE" ]; then
              gh issue close "$OUVERTE" --comment "Retour a la normale — toutes les pages sont saines."
            fi
          fi

      - name: Sauvegarder les preuves (captures ecran, DOM)
        if: steps.verif.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ github.run_id }}
          path: artifacts/
          retention-days: 14

      - name: Statut final du run
        if: steps.verif.outcome == 'failure'
        run: exit 1
