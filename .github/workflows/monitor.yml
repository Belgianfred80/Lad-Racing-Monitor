              font-family:"JetBrains Mono", ui-monospace, monospace; }
            .etat-svc.ok, .ok { color:var(--vert); } .etat-svc.ko, .ko { color:var(--rouge); }
            .titre-frise { font-size:.68rem; letter-spacing:.16em; text-transform:uppercase;
              color:var(--tres-doux); margin:18px 0 10px; font-weight:600; }
