name: Monitoring Ladbrokes

on:
  schedule:
    - cron: "*/31 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Lancer les verifications
        id: verif
        continue-on-error: true
        run: node monitor/check.js

      - name: Recuperer les derniers incidents
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label monitoring --state all --limit 2 --json title,body,url,state,createdAt,closedAt > dernier_incident.json || echo "[]" > dernier_incident.json

      - name: Generer le rapport et la page de statut
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          let d = null;
          try { d = JSON.parse(fs.readFileSync("artifacts/summary.json")); } catch(e) {}
          if (!d) {
            fs.writeFileSync("issue.md", "Le monitoring lui-meme a rencontre une erreur technique (aucun resultat produit). Voir les logs du run.");
            fs.writeFileSync("nb_echecs.txt", "1");
            process.exit(0);
          }
          let seuilMs = 15000;
          try { seuilMs = require("./monitor/pages.config.js").maxLoadTimeMs || 15000; } catch(e) {}
          const fdate = (iso) => new Date(iso).toLocaleString("fr-BE", { timeZone: "Europe/Brussels" });
          const date = fdate(d.date);
          const detail = (r) => r.details[r.details.length-1].split("|").join("-");
          const echapper = (t) => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
          let md = "# Etat du monitoring Ladbrokes\n\nDerniere verification : **" + date + "** (heure belge)\n\n| Page | Etat | Detail |\n|---|---|---|\n";
          for (const r of d.results) {
            md += "| [" + r.name + "](" + r.url + ") | " + (r.ok ? "OK" : "ECHEC") + " | " + detail(r) + " |\n";
          }
          fs.writeFileSync("STATUS.md", md);
          let issue = "Verification du " + date + " (heure belge)\n\n";
          for (const r of d.results) {
            issue += (r.ok ? "OK — " : "ECHEC — ") + "**" + r.name + "**\nURL : " + r.url + "\nDetail : " + detail(r) + "\n\n";
          }
          issue += "_Les captures sont dans la section Artifacts du run._";
          fs.writeFileSync("issue.md", issue);
          fs.writeFileSync("nb_echecs.txt", String(d.results.filter(r => !r.ok).length));
          let incidentHtml = "<p class=\"vide\">Aucun incident enregistre.</p>";
          try {
            const incs = JSON.parse(fs.readFileSync("dernier_incident.json")).slice(0, 2);
            if (incs.length) {
              incidentHtml = incs.map(function(inc, i) {
                const resolu = inc.state === "CLOSED";
                const badge = resolu
                  ? `<span class="pill pill-ok">Resolu ${fdate(inc.closedAt)}</span>`
                  : `<span class="pill pill-ko">En cours</span>`;
                const corps = echapper(inc.body || "")
                  .split("\n").filter((l) => !l.startsWith("_")).join("\n")
                  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                  .replace(/\n/g, "<br>");
                return `<article class="incident ${resolu ? "ok" : "ko"}">
                  <div class="incident-tete">
                    <span class="rang">${i === 0 ? "Le plus recent" : "Precedent"}</span>${badge}
                  </div>
                  <h3><a href="${inc.url}">${echapper(inc.title)}</a></h3>
                  <p class="quand">Ouvert le ${fdate(inc.createdAt)}</p>
                  <div class="corps">${corps}</div>
                </article>`;
              }).join("");
            }
          } catch(e) {}
          const carte = (r) => {
            const secondes = r.loadTimeMs ? (r.loadTimeMs / 1000).toFixed(1) : null;
            const pct = r.loadTimeMs ? Math.min(100, Math.round((r.loadTimeMs / seuilMs) * 100)) : 0;
            const raison = r.ok ? "" : `<p class="raison">${echapper(detail(r))}</p>`;
            return `<article class="carte ${r.ok ? "ok" : "ko"}">
              <div class="carte-tete">
                <span class="marque">${r.ok ? "&#10003;" : "&#10005;"}</span>
                <h2>${r.name}</h2>
                <span class="pill ${r.ok ? "pill-ok" : "pill-ko"}">${r.ok ? "En ligne" : "Probleme"}</span>
              </div>
              <a class="url" href="${r.url}">${r.url}</a>
              <div class="mesure">
                <span class="chiffre">${secondes ? secondes : "--"}</span><span class="unite">s</span>
                <span class="libelle">temps de chargement</span>
              </div>
              <div class="piste"><span style="width:${pct}%"></span></div>
              <p class="seuil">seuil ${(seuilMs / 1000).toFixed(0)} s</p>
              ${raison}
            </article>`;
          };
          const scriptClient = [
            "<script>",
            "var genere = \"" + d.date + "\";",
            "var diff = Math.round((Date.now() - new Date(genere).getTime()) / 60000);",
            "if (diff > 45) {",
            "  document.getElementById(\"banniere-retard\").style.display = \"block\";",
            "  document.getElementById(\"retard-min\").textContent = diff;",
            "}",
            "function fh(iso) {",
            "  if (!iso) return null;",
            "  return new Date(iso).toLocaleString(\"fr-BE\", { timeZone: \"Europe/Brussels\", day: \"2-digit\", month: \"2-digit\", year: \"numeric\", hour: \"2-digit\", minute: \"2-digit\" });",
            "}",
            "fetch(\"https://www.githubstatus.com/api/v2/components.json\")",
            "  .then(function(r){ return r.json(); })",
            "  .then(function(data){",
            "    var noms = { \"Actions\": \"gh-actions\", \"Pages\": \"gh-pages\" };",
            "    data.components.forEach(function(c){",
            "      var id = noms[c.name];",
            "      if (!id) return;",
            "      var el = document.getElementById(id);",
            "      if (!el) return;",
            "      if (c.status === \"operational\") {",
            "        el.className = \"etat-svc ok\"; el.innerHTML = \"&#10003; Operationnel\";",
            "      } else {",
            "        el.className = \"etat-svc ko\"; el.innerHTML = \"&#10005; \" + c.status.split(\"_\").join(\" \");",
            "      }",
            "    });",
            "  })",
            "  .catch(function(){});",
            "fetch(\"https://www.githubstatus.com/api/v2/incidents.json\")",
            "  .then(function(r){ return r.json(); })",
            "  .then(function(data){",
            "    var vise = [\"Actions\", \"Pages\"];",
            "    var lignes = [];",
            "    (data.incidents || []).forEach(function(inc){",
            "      if (lignes.length >= 5) return;",
            "      var touches = (inc.components || []).map(function(c){ return c.name; }).filter(function(n){ return vise.indexOf(n) >= 0; });",
            "      if (touches.length === 0) return;",
            "      var fin = inc.resolved_at ? (\"<span class=ok>fini \" + fh(inc.resolved_at) + \"</span>\") : \"<span class=ko>en cours</span>\";",
            "      lignes.push(\"<li><p class=quand>\" + fh(inc.created_at) + \" &rarr; \" + fin + \"</p><p class=quoi>\" + inc.name + \" — \" + touches.join(\", \") + \" · <a href=\" + inc.shortlink + \">details</a></p></li>\");",
            "    });",
            "    document.getElementById(\"gh-incidents\").innerHTML = lignes.length ? \"<ul>\" + lignes.join(\"\") + \"</ul>\" : \"<p class=vide>Aucun incident recent sur ces services.</p>\";",
            "  })",
            "  .catch(function(){ document.getElementById(\"gh-incidents\").innerHTML = \"<p class=vide>Historique indisponible.</p>\"; });",
            "</" + "script>",
          ].join("\n");
          const html = `<!DOCTYPE html>
          <html lang="fr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="300">
          <title>Statut monitoring Ladbrokes</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
          <style>
            :root {
              --fond:#0e1319; --panneau:#161d26; --bord:#232d39;
              --texte:#e8edf3; --doux:#8b98a8;
              --vert:#37d99a; --rouge:#ff6259; --ambre:#f2b544;
            }
            * { box-sizing:border-box; }
            body { margin:0; background:var(--fond); color:var(--texte);
              font-family:"Inter Tight", system-ui, -apple-system, Segoe UI, sans-serif;
              -webkit-font-smoothing:antialiased; }
            .wrap { max-width:760px; margin:0 auto; padding:40px 20px 64px; }
            .tete { border-bottom:1px solid var(--bord); padding-bottom:22px; margin-bottom:28px; }
            .eyebrow { margin:0 0 6px; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--doux); }
            h1 { margin:0; font-size:2.1rem; font-weight:700; letter-spacing:-.02em; }
            .horodatage { margin:10px 0 0; font-size:.85rem; color:var(--doux);
              font-family:"JetBrains Mono", ui-monospace, monospace; }
            .pulse { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--vert);
              margin-right:8px; box-shadow:0 0 0 4px rgba(55,217,154,.15); }
            .banniere { display:none; margin-bottom:24px; padding:14px 18px; border-radius:12px;
              background:rgba(242,181,68,.1); border:1px solid rgba(242,181,68,.35); color:#f6d79a; font-size:.9rem; }
            h2.section { font-size:.78rem; letter-spacing:.16em; text-transform:uppercase; color:var(--doux);
              margin:38px 0 14px; font-weight:600; }
            .carte { background:var(--panneau); border:1px solid var(--bord); border-radius:16px;
              padding:20px 22px; margin-bottom:14px; position:relative; overflow:hidden; }
            .carte::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--vert); }
            .carte.ko::before { background:var(--rouge); }
            .carte-tete { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
            .marque { width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
              font-size:.72rem; font-weight:700; background:rgba(55,217,154,.16); color:var(--vert); }
            .carte.ko .marque { background:rgba(255,98,89,.16); color:var(--rouge); }
            .carte h2 { margin:0; font-size:1.05rem; font-weight:600; flex:1; }
            .pill { font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; font-weight:700;
              padding:4px 10px; border-radius:99px; white-space:nowrap; }
            .pill-ok { background:rgba(55,217,154,.14); color:var(--vert); }
            .pill-ko { background:rgba(255,98,89,.14); color:var(--rouge); }
            .url { display:block; margin:10px 0 18px; font-size:.78rem; color:#6f8ac4;
              font-family:"JetBrains Mono", ui-monospace, monospace; text-decoration:none; word-break:break-all; }
            .url:hover { color:#9ab2e8; text-decoration:underline; }
            .mesure { display:flex; align-items:baseline; gap:6px; }
            .chiffre { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:2.4rem;
              font-weight:700; line-height:1; letter-spacing:-.03em; }
            .unite { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:1rem; color:var(--doux); }
            .libelle { margin-left:8px; font-size:.78rem; color:var(--doux); }
            .piste { height:5px; border-radius:99px; background:#0a0f14; margin:14px 0 6px; overflow:hidden; }
            .piste span { display:block; height:100%; border-radius:99px;
              background:linear-gradient(90deg,var(--vert),#5ee0b4); }
            .carte.ko .piste span { background:linear-gradient(90deg,var(--rouge),#ff9a94); }
            .seuil { margin:0; font-size:.7rem; color:#5d6b7c; letter-spacing:.06em;
              font-family:"JetBrains Mono", ui-monospace, monospace; }
            .raison { margin:14px 0 0; padding:10px 12px; border-radius:10px; font-size:.82rem;
              background:rgba(255,98,89,.08); color:#ffb3ae; word-break:break-word; }
            .incident { background:var(--panneau); border:1px solid var(--bord); border-radius:16px;
              padding:18px 20px; margin-bottom:14px; }
            .incident-tete { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
            .rang { font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--doux); flex:1; }
            .incident h3 { margin:0; font-size:.98rem; font-weight:600; }
            .incident h3 a { color:var(--texte); text-decoration:none; }
            .incident h3 a:hover { text-decoration:underline; }
            .incident .quand { margin:4px 0 12px; font-size:.76rem; color:var(--doux);
              font-family:"JetBrains Mono", ui-monospace, monospace; }
            .corps { font-size:.82rem; line-height:1.6; color:#b9c6d4; background:#0f151c;
              border:1px solid var(--bord); border-radius:10px; padding:12px 14px; word-break:break-word; }
            .infra { background:var(--panneau); border:1px solid var(--bord); border-radius:16px; padding:6px 20px; }
            .infra p { display:flex; justify-content:space-between; align-items:center; gap:12px;
              margin:0; padding:14px 0; font-size:.9rem; border-bottom:1px solid var(--bord); }
            .infra p:last-child { border-bottom:none; }
            .infra small { display:block; color:var(--doux); font-size:.74rem; font-weight:400; }
            .etat-svc { font-size:.8rem; font-weight:600; white-space:nowrap; color:var(--doux);
              font-family:"JetBrains Mono", ui-monospace, monospace; }
            .etat-svc.ok, .ok { color:var(--vert); } .etat-svc.ko, .ko { color:var(--rouge); }
            .timeline ul { list-style:none; margin:0; padding:0 0 0 18px; border-left:1px solid var(--bord); }
            .timeline li { position:relative; padding:0 0 18px 18px; }
            .timeline li::before { content:""; position:absolute; left:-23px; top:6px; width:9px; height:9px;
              border-radius:50%; background:var(--bord); border:2px solid var(--fond); }
            .timeline .quand { margin:0 0 3px; font-size:.8rem; font-weight:600;
              font-family:"JetBrains Mono", ui-monospace, monospace; }
            .timeline .quoi { margin:0; font-size:.8rem; color:var(--doux); }
            .timeline a, .infra a { color:#6f8ac4; }
            .vide { font-size:.85rem; color:var(--doux); margin:0; }
            footer { margin-top:44px; padding-top:18px; border-top:1px solid var(--bord);
              font-size:.72rem; color:#5d6b7c; line-height:1.7; }
            @media (max-width:520px) { h1 { font-size:1.6rem; } .chiffre { font-size:1.9rem; } }
          </style></head><body>
          <div class="wrap">
            <header class="tete">
              <p class="eyebrow">Surveillance des pages de courses</p>
              <h1>Ladbrokes.be</h1>
              <p class="horodatage"><span class="pulse"></span>Derniere verification ${date}</p>
            </header>
            <div id="banniere-retard" class="banniere">Cette page date de <span id="retard-min"></span> minutes. Le monitoring semble retarde : verifiez l etat de GitHub Actions plus bas.</div>
            ${d.results.map(carte).join("")}
            <h2 class="section">Derniers incidents detectes</h2>
            ${incidentHtml}
            <h2 class="section">Infrastructure du monitoring</h2>
            <div class="infra">
              <p>GitHub Actions <small>execute les verifications</small> <span id="gh-actions" class="etat-svc">...</span></p>
              <p>GitHub Pages <small>heberge cette page</small> <span id="gh-pages" class="etat-svc">...</span></p>
            </div>
            <h2 class="section">Incidents GitHub sur ces services</h2>
            <div id="gh-incidents" class="timeline"><p class="vide">chargement...</p></div>
            <footer>Page regeneree a chaque verification, toutes les 31 minutes. Toutes les heures sont en heure belge (Europe/Brussels). Etat des services GitHub interroge en direct par votre navigateur.</footer>
          </div>
          ${scriptClient}
          </body></html>`;
          fs.writeFileSync("index.html", html);
          '

      - name: Publier la page de statut
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add STATUS.md index.html 2>/dev/null || git add STATUS.md
          git diff --cached --quiet || git commit -m "Mise a jour du statut"
          git push || true

      - name: Alerter ou clore (e-mail via Issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NB=$(cat nb_echecs.txt 2>/dev/null || echo "1")
          gh label create monitoring --color D93F0B --description "Alerte du monitoring" 2>/dev/null || true
          OUVERTE=$(gh issue list --label monitoring --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ "$NB" != "0" ]; then
            if [ -z "$OUVERTE" ]; then
              gh issue create --title "ALERTE Monitoring Ladbrokes : $NB page(s) en echec" --body-file issue.md --label monitoring
            else
              echo "Alerte deja ouverte (#$OUVERTE), pas de nouvel e-mail."
            fi
          else
            if [ -n "$OUVERTE" ]; then
              gh issue close "$OUVERTE" --comment "Retour a la normale — toutes les pages sont saines."
            fi
          fi

      - name: Sauvegarder les preuves (captures ecran, DOM)
        if: steps.verif.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ github.run_id }}
          path: artifacts/
          retention-days: 14

      - name: Statut final du run
        if: steps.verif.outcome == 'failure'
        run: exit 1
